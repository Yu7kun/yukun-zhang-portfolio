<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690"><rect width="1600" height="690" rx="34" fill="#0d1720"/><text x="92" y="94" fill="#fff" font-family="Arial" font-size="36" font-weight="700">Digital-by-Default Services — Four Coping Strategies</text><text x="92" y="137" fill="#94a3b8" font-family="Arial" font-size="22">Exploratory ethnographic research on middle-aged and older adults (50+).</text><g font-family="Arial"><rect x="90" y="218" width="330" height="210" rx="28" fill="#123d4a"/><text x="125" y="275" fill="#fff" font-size="25" font-weight="700">01 · Delegate</text><text x="125" y="316" fill="#cbd5e1" font-size="19">Rely on family, volunteers</text><text x="125" y="348" fill="#cbd5e1" font-size="19">or frontline staff as helpers.</text><rect x="455" y="218" width="330" height="210" rx="28" fill="#27425f"/><text x="490" y="275" fill="#fff" font-size="25" font-weight="700">02 · Trust</text><text x="490" y="316" fill="#cbd5e1" font-size="19">Use institutional trust as a</text><text x="490" y="348" fill="#cbd5e1" font-size="19">shortcut through opacity.</text><rect x="820" y="218" width="330" height="210" rx="28" fill="#4b3b63"/><text x="855" y="275" fill="#fff" font-size="25" font-weight="700">03 · Endure</text><text x="855" y="316" fill="#cbd5e1" font-size="19">Live with device constraints</text><text x="855" y="348" fill="#cbd5e1" font-size="19">and “upgrade inertia”.</text><rect x="1185" y="218" width="325" height="210" rx="28" fill="#5e3b49"/><text x="1220" y="275" fill="#fff" font-size="25" font-weight="700">04 · Normalize</text><text x="1220" y="316" fill="#cbd5e1" font-size="19">Frame difficulty as a</text><text x="1220" y="348" fill="#cbd5e1" font-size="19">“generational difference”.</text></g><text x="92" y="526" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Insight</text><text x="92" y="570" fill="#cbd5e1" font-family="Arial" font-size="21">Short-term coping can make services workable while also hiding structural barriers and platform dependence.</text></svg>